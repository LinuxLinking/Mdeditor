name: Build & Release APK

# 触发方式：
#   1. 打 v 开头的 tag（如 v1.0.2）→ build + 自动发 GitHub Release 并挂 APK
#   2. 手动触发（workflow_dispatch）→ 只 build，APK 作为 artifact 上传供下载验证
# 签名说明：本仓库 release buildType 已固定用 debug 签名
# (android/app/build.gradle.kts: signingConfig = signingConfigs.getByName("debug"))，
# 不依赖 key.properties / keystore，CI 可直接出包。debug 签名能装能测，不能上架商店。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      # 手动触发：把 APK 挂成 artifact，可在 Actions 运行页下载（不公开发布）
      - name: Upload APK artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: mdeditor-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # tag 触发：发 GitHub Release 并挂 APK，自动生成 release notes（基于 commit）
      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
