name: Build APK

# 触发：
# 1. push 到 master 且安卓/Flutter 相关路径有改动（构建验证）。
# 2. 手动触发（workflow_dispatch）。
# 3. 发布 Release（published）时自动构建，把 APK 以 Mdeditor-<tag>.apk 与
#    Mdeditor-latest.apk 两个名字附到该 Release——发版只需改 pubspec.yaml 版本号、
#    打 tag、写说明点发布，无需本地构建上传。
#    ios-v* tag 的 Release（iOS 里程碑，prerelease）不构建安卓。
#
# 签名说明：未配置 ANDROID_KEYSTORE_BASE64 secret 时自动回退 debug 签名
# （日志有 warning，debug 签名的 APK 不能稳定覆盖安装）。配置正式密钥的
# 完整步骤见仓库根目录 AGENTS.md 施工单A，配好后本工作流无需任何改动。
on:
  push:
    branches:
      - master
    paths:
      - 'android/**'
      - 'lib/**'
      - 'assets/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build.yml'
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  build:
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'ios-')
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # release 事件时上传资产需要写权限

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Show toolchain
        run: flutter --version

      - name: Run tests
        run: flutter test

      # secrets 未配置时文件不存在，KEYSTORE_FILE 不导出，gradle 自动回退 debug 签名
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mdeditor-release.keystore"
          else
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64 secret，本次构建使用 debug 签名（无法稳定覆盖安装）。配置正式密钥见 AGENTS.md 施工单A。"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -f "$RUNNER_TEMP/mdeditor-release.keystore" ]; then
            export KEYSTORE_FILE="$RUNNER_TEMP/mdeditor-release.keystore"
          fi
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: mdeditor-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APKs to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cd build/app/outputs/flutter-apk
          cp app-release.apk "Mdeditor-${TAG}.apk"
          cp app-release.apk Mdeditor-latest.apk
          gh release upload "$TAG" "Mdeditor-${TAG}.apk" Mdeditor-latest.apk --clobber
